plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Dynamic Trees (from mavenLocal)
    implementation "com.dtteam.dynamictrees:dynamictrees-fabric-26.2:${dynamicTreesVersion}"

    // Biomes O' Plenty (compile-only compat)
    compileOnly "maven.modrinth:biomes-o-plenty:${bopVersion}"
    compileOnly "maven.modrinth:glitchcore:${glitchcoreVersion}"
}

processResources {
    inputs.property 'mod_version', mod_version

    filesMatching('fabric.mod.json') {
        expand 'mod_version': mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
